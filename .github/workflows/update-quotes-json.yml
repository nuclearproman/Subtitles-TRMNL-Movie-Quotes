
name: Update quotes.json from CSV

on:
  push:
    branches:
      - main
    paths:
      - "movie_quotes.csv"
      - "scripts/csv_to_json.py"
      - ".github/workflows/update-quotes-json.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate quotes.json
        run: python scripts/csv_to_json.py

      - name: Commit updated JSON
        run: |
          if git diff --quiet -- quotes.json; then
            echo "quotes.json is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes.json
          git commit -m "Update quotes.json from CSV"
          git push
